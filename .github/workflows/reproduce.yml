name: Reproduce V7 controls

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/reproduce.py --mode full
      - run: python examples/run_scenario.py --region ARA --inventory 0.85
      - run: python examples/run_scenario.py --region ARA --inventory 4.81 --output reproduced/ara_coal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducibility-reports
          path: |
            reproduced/*.json
            reproduced/*.log
          retention-days: 30
